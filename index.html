<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Reach — Message the right way</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --card: #141416;
      --border: #2a2a30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #22d3ee;
      --danger: #f87171;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
    }
    .app { max-width: 480px; margin: 0 auto; padding: 0 16px 120px; }
    header {
      padding: calc(16px + env(safe-area-inset-top)) 0 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      display: grid; place-items: center; font-weight: 800; color: #0a0a0b;
    }
    .brand h1 { font-size: 1.15rem; letter-spacing: -0.03em; }
    .brand p { font-size: 0.75rem; color: var(--muted); }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px;
    }
    .tab {
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 12px; padding: 10px; font-weight: 700; cursor: pointer;
    }
    .tab.active {
      color: #0a0a0b; background: linear-gradient(135deg, #22d3ee, #818cf8); border-color: transparent;
    }
    .search input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px; color: var(--text); font-size: 1rem; outline: none;
      margin-bottom: 14px;
    }
    .search input:focus { border-color: var(--accent); }
    .section-title {
      font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 8px 0 10px; font-weight: 700;
    }
    .list { display: grid; gap: 8px; }
    .contact, .follow-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(145deg, #1f2937, #312e81);
      display: grid; place-items: center; font-weight: 700; color: #e0e7ff; flex: none;
    }
    .info { flex: 1; min-width: 0; cursor: pointer; }
    .name {
      font-weight: 650; font-size: 0.98rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .meta {
      font-size: 0.8rem; color: var(--muted); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .channel-tag {
      font-size: 0.7rem; color: var(--accent); margin-top: 2px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .msg-btn, .small-btn {
      border: none; border-radius: 12px; padding: 8px 12px;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      color: #0a0a0b; font-weight: 700; font-size: 0.8rem; cursor: pointer; flex: none;
    }
    .small-btn.secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .badge {
      font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      background: #fbbf2422; color: var(--warn);
    }
    .badge.overdue { background: #f8717122; color: var(--danger); }
    .empty {
      text-align: center; padding: 40px 16px; color: var(--muted);
      border: 1px dashed var(--border); border-radius: 18px;
    }
    .empty strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 1.05rem; }
    .fab {
      position: fixed; right: max(16px, calc(50% - 240px + 16px));
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 58px; height: 58px; border: none; border-radius: 18px;
      background: linear-gradient(135deg, #22d3ee, #818cf8); color: #0a0a0b;
      font-size: 1.8rem; font-weight: 700; box-shadow: 0 12px 30px rgba(34,211,238,.25); cursor: pointer;
    }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(8px);
      display: none; align-items: flex-end; justify-content: center; padding: 12px; z-index: 50;
    }
    .modal.show { display: flex; }
    .sheet {
      width: 100%; max-width: 480px; max-height: 92dvh; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 18px;
    }
    .sheet-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    }
    .sheet-head h2 { font-size: 1.15rem; letter-spacing: -0.02em; }
    .close {
      width: 36px; height: 36px; border: none; border-radius: 12px;
      background: #ffffff12; color: var(--text); font-size: 1.2rem; cursor: pointer;
    }
    label {
      display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 6px; font-weight: 600;
    }
    input, select, textarea {
      width: 100%; background: #0a0a0b; border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 12px; color: var(--text); font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 100px; resize: vertical; }
    .btn {
      width: 100%; margin-top: 12px; border: none; border-radius: 14px; padding: 13px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      background: linear-gradient(135deg, #22d3ee, #818cf8); color: #0a0a0b;
    }
    .btn-secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .btn-danger {
      background: transparent; border: 1px solid #7f1d1d; color: var(--danger);
    }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .templates { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip {
      border: 1px solid var(--border); background: #ffffff0a; color: var(--text);
      border-radius: 999px; padding: 7px 11px; font-size: 0.8rem; cursor: pointer;
    }
    .to-line {
      background: #0a0a0b; border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    }
    .to-line strong { display: block; font-size: 0.95rem; }
    .to-line span { font-size: 0.8rem; color: var(--muted); }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: #1f2937; border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; display: none; z-index: 60;
      max-width: calc(100% - 32px);
    }
    .toast.show { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">R</div>
        <div>
          <h1>Reach</h1>
          <p>Message the right way</p>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tabContacts" type="button">Contacts</button>
      <button class="tab" id="tabFollowups" type="button">Follow-ups</button>
    </div>

    <div id="contactsView">
      <div class="search">
        <input id="search" type="search" placeholder="Search contacts..." />
      </div>
      <div class="section-title">Contacts</div>
      <div id="list" class="list"></div>
    </div>

    <div id="followView" class="hidden">
      <div class="section-title">Due follow-ups</div>
      <div id="followList" class="list"></div>
    </div>
  </div>

  <button class="fab" id="addBtn" title="Add contact">+</button>

  <!-- Add / Edit -->
  <div class="modal" id="modal">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="modalTitle">Add contact</h2>
        <button class="close" id="closeBtn" type="button">×</button>
      </div>

      <button class="btn btn-secondary" id="pickContactBtn" type="button">From phone book</button>
      <p class="hint" id="pickHint">Works best in Chrome on Android. On iPhone add manually.</p>

      <label for="name">Name</label>
      <input id="name" placeholder="Alex Johnson" />

      <label for="channel">Preferred channel</label>
      <select id="channel">
        <option value="whatsapp">WhatsApp</option>
        <option value="telegram">Telegram</option>
        <option value="sms">SMS</option>
        <option value="email">Email</option>
      </select>

      <label for="handle" id="handleLabel">WhatsApp number</label>
      <input id="handle" placeholder="+1234567890" />

      <label for="note">Note (optional)</label>
      <textarea id="note" placeholder="Prefers short messages..."></textarea>
      <p class="hint" id="hint">Use full international phone number for WhatsApp/SMS.</p>

      <button class="btn" id="saveBtn" type="button">Save contact</button>
      <button class="btn btn-danger" id="deleteBtn" type="button" style="display:none">Delete</button>
    </div>
  </div>

  <!-- Compose -->
  <div class="modal" id="composeModal">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Message</h2>
        <button class="close" id="composeClose" type="button">×</button>
      </div>

      <div class="to-line">
        <strong id="composeName">Contact</strong>
        <span id="composeMeta">channel</span>
      </div>

      <label for="message">Message</label>
      <textarea id="message" placeholder="Write your message..."></textarea>

      <div class="section-title" style="margin-top:14px">Quick templates</div>
      <div class="templates">
        <button class="chip" type="button" data-t="Hi! Just wanted to follow up.">Follow-up</button>
        <button class="chip" type="button" data-t="Thanks a lot!">Thanks</button>
        <button class="chip" type="button" data-t="Are you free for a quick call this week?">Call?</button>
        <button class="chip" type="button" data-t="I've arrived, all good.">Arrived</button>
      </div>

      <label for="remindDays">Remind me to follow up</label>
      <select id="remindDays">
        <option value="0">No reminder</option>
        <option value="1">In 1 day</option>
        <option value="3" selected>In 3 days</option>
        <option value="7">In 7 days</option>
        <option value="14">In 14 days</option>
      </select>

      <button class="btn" id="sendBtn" type="button">Open messenger</button>
      <button class="btn btn-secondary" id="copyMsgBtn" type="button">Copy message</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const STORAGE_KEY = 'reach_contacts_v1';
    let editingId = null;
    let composeContact = null;

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function save(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2400);
    }
    function initials(name) {
      return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
    }
    function channelLabel(c) {
      return ({ whatsapp: 'WhatsApp', telegram: 'Telegram', sms: 'SMS', email: 'Email' })[c] || c;
    }
    function cleanPhone(v) {
      return String(v || '').replace(/[^\d+]/g, '').replace(/(?!^)\+/g, '');
    }
    function cleanTelegram(v) {
      return String(v || '').trim().replace(/^@/, '');
    }
    function startOfDay(ts) {
      const d = new Date(ts);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }
    function formatDate(ts) {
      return new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function buildLink(contact, text) {
      const channel = contact.channel;
      const handle = contact.handle || '';
      const msg = text || '';
      if (channel === 'whatsapp') {
        const phone = cleanPhone(handle).replace(/^\+/, '');
        return 'https://wa.me/' + phone + (msg ? '?text=' + encodeURIComponent(msg) : '');
      }
      if (channel === 'telegram') {
        const user = cleanTelegram(handle);
        if (/^\+?\d{6,}$/.test(user)) return 'https://t.me/+' + user.replace(/^\+/, '');
        return 'https://t.me/' + user;
      }
      if (channel === 'sms') {
        const phone = cleanPhone(handle);
        return 'sms:' + phone + (msg ? '?body=' + encodeURIComponent(msg) : '');
      }
      if (channel === 'email') {
        return 'mailto:' + handle + (msg ? '?body=' + encodeURIComponent(msg) : '');
      }
      return null;
    }

    function handleLabel(channel) {
      if (channel === 'whatsapp') return 'WhatsApp number';
      if (channel === 'telegram') return 'Telegram username or phone';
      if (channel === 'sms') return 'Phone number';
      return 'Email address';
    }
    function handlePlaceholder(channel) {
      if (channel === 'whatsapp' || channel === 'sms') return '+1234567890';
      if (channel === 'telegram') return '@username';
      return 'name@email.com';
    }
    function handleHint(channel) {
      if (channel === 'whatsapp' || channel === 'sms') return 'Use full international number, e.g. +1234567890';
      if (channel === 'telegram') return 'Username without @, or phone number';
      return 'Full email address';
    }
    function updateChannelUI() {
      const channel = $('channel').value;
      $('handleLabel').textContent = handleLabel(channel);
      $('handle').placeholder = handlePlaceholder(channel);
      $('hint').textContent = handleHint(channel);
    }

    function supportsContacts() {
      return !!(navigator.contacts && navigator.contacts.select);
    }

    async function pickFromPhoneBook() {
      if (!supportsContacts()) {
        toast('Phone book not supported in this browser');
        return;
      }
      try {
        const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: false });
        if (!contacts || !contacts.length) return;
        const c = contacts[0];
        const name = (c.name && c.name[0]) || '';
        const tel = (c.tel && c.tel[0]) || '';
        const email = (c.email && c.email[0]) || '';
        $('name').value = name;
        if (tel) {
          $('channel').value = 'whatsapp';
          $('handle').value = tel;
        } else if (email) {
          $('channel').value = 'email';
          $('handle').value = email;
        }
        updateChannelUI();
        toast('Contact imported');
      } catch (e) {
        toast('Could not open phone book');
      }
    }

    function renderContacts() {
      const q = ($('search').value || '').trim().toLowerCase();
      let list = load().sort((a, b) => a.name.localeCompare(b.name));
      if (q) {
        list = list.filter(c =>
          (c.name || '').toLowerCase().includes(q) ||
          (c.handle || '').toLowerCase().includes(q) ||
          (c.note || '').toLowerCase().includes(q)
        );
      }
      const box = $('list');
      box.innerHTML = '';
      if (!list.length) {
        box.innerHTML = `<div class="empty"><strong>\( {q ? 'No matches' : 'No contacts yet'}</strong> \){q ? 'Try another search.' : 'Tap + to add your first contact.'}</div>`;
        return;
      }
      list.forEach(c => {
        const row = document.createElement('div');
        row.className = 'contact';
        row.innerHTML = `
          <div class="avatar">${initials(c.name)}</div>
          <div class="info">
            <div class="name"></div>
            <div class="meta"></div>
            <div class="channel-tag"></div>
          </div>
          <button class="msg-btn" type="button">Message</button>
        `;
        row.querySelector('.name').textContent = c.name;
        row.querySelector('.meta').textContent = c.handle + (c.note ? ' · ' + c.note : '');
        row.querySelector('.channel-tag').textContent = channelLabel(c.channel);
        row.querySelector('.info').onclick = () => openEdit(c.id);
        row.querySelector('.msg-btn').onclick = e => { e.stopPropagation(); openCompose(c.id); };
        box.appendChild(row);
      });
    }

    function renderFollowups() {
      const today = startOfDay(Date.now());
      const list = load()
        .filter(c => c.followUpAt)
        .sort((a, b) => a.followUpAt - b.followUpAt);

      const box = $('followList');
      box.innerHTML = '';

      if (!list.length) {
        box.innerHTML = `<div class="empty"><strong>No follow-ups</strong>When you message someone, set a reminder.</div>`;
        return;
      }

      list.forEach(c => {
        const overdue = startOfDay(c.followUpAt) < today;
        const dueToday = startOfDay(c.followUpAt) === today;
        const row = document.createElement('div');
        row.className = 'follow-item';
        row.innerHTML = `
          <div class="avatar">${initials(c.name)}</div>
          <div class="info">
            <div class="name"></div>
            <div class="meta"></div>
          </div>
          <span class="badge \( {overdue ? 'overdue' : ''}"> \){overdue ? 'Overdue' : dueToday ? 'Today' : formatDate(c.followUpAt)}</span>
          <button class="msg-btn" type="button">Message</button>
        `;
        row.querySelector('.name').textContent = c.name;
        row.querySelector('.meta').textContent = channelLabel(c.channel) + ' · ' + c.handle;
        row.querySelector('.msg-btn').onclick = () => openCompose(c.id);
        box.appendChild(row);
      });
    }

    function showContacts() {
      $('tabContacts').classList.add('active');
      $('tabFollowups').classList.remove('active');
      $('contactsView').classList.remove('hidden');
      $('followView').classList.add('hidden');
      $('addBtn').style.display = 'block';
      renderContacts();
    }
    function showFollowups() {
      $('tabFollowups').classList.add('active');
      $('tabContacts').classList.remove('active');
      $('followView').classList.remove('hidden');
      $('contactsView').classList.add('hidden');
      $('addBtn').style.display = 'none';
      renderFollowups();
    }

    function openAdd() {
      editingId = null;
      $('modalTitle').textContent = 'Add contact';
      $('name').value = '';
      $('channel').value = 'whatsapp';
      $('handle').value = '';
      $('note').value = '';
      $('deleteBtn').style.display = 'none';
      updateChannelUI();
      $('pickContactBtn').style.display = 'block';
      $('modal').classList.add('show');
    }
    function openEdit(id) {
      const c = load().find(x => x.id === id);
      if (!c) return;
      editingId = id;
      $('modalTitle').textContent = 'Edit contact';
      $('name').value = c.name || '';
      $('channel').value = c.channel || 'whatsapp';
      $('handle').value = c.handle || '';
      $('note').value = c.note || '';
      $('deleteBtn').style.display = 'block';
      updateChannelUI();
      $('modal').classList.add('show');
    }
    function closeModal() {
      $('modal').classList.remove('show');
      editingId = null;
    }
    function saveContact() {
      const name = $('name').value.trim();
      const channel = $('channel').value;
      const handle = $('handle').value.trim();
      const note = $('note').value.trim();
      if (!name) return toast('Enter a name');
      if (!handle) return toast('Enter a contact handle');
      const list = load();
      if (editingId) {
        const i = list.findIndex(x => x.id === editingId);
        if (i >= 0) list[i] = { ...list[i], name, channel, handle, note, updatedAt: Date.now() };
        toast('Contact updated');
      } else {
        list.unshift({
          id: Date.now(), name, channel, handle, note,
          createdAt: Date.now(), updatedAt: Date.now(), followUpAt: null
        });
        toast('Contact saved');
      }
      save(list);
      closeModal();
      renderContacts();
    }
    function deleteContact() {
      if (!editingId) return;
      if (!confirm('Delete this contact?')) return;
      save(load().filter(x => x.id !== editingId));
      toast('Contact deleted');
      closeModal();
      renderContacts();
      renderFollowups();
    }

    function openCompose(id) {
      const c = load().find(x => x.id === id);
      if (!c) return;
      composeContact = c;
      $('composeName').textContent = c.name;
      $('composeMeta').textContent = channelLabel(c.channel) + ' · ' + c.handle;
      $('message').value = '';
      $('remindDays').value = '3';
      $('composeModal').classList.add('show');
    }
    function closeCompose() {
      $('composeModal').classList.remove('show');
      composeContact = null;
    }
    function applyReminder() {
      if (!composeContact) return;
      const days = Number($('remindDays').value || 0);
      const list = load();
      const i = list.findIndex(x => x.id === composeContact.id);
      if (i < 0) return;
      if (days > 0) {
        const when = startOfDay(Date.now()) + days * 24 * 60 * 60 * 1000;
        list[i].followUpAt = when;
      }
      list[i].lastMessagedAt = Date.now();
      save(list);
    }
    function sendMessage() {
      if (!composeContact) return;
      const text = $('message').value.trim();
      const link = buildLink(composeContact, text);
      if (!link) return toast('Could not build link');
      applyReminder();
      if (composeContact.channel === 'telegram' && text) {
        navigator.clipboard.writeText(text).then(() => {
          toast('Copied — paste in Telegram');
          window.open(link, '_blank');
        }).catch(() => window.open(link, '_blank'));
        return;
      }
      window.open(link, '_blank');
      toast('Reminder saved');
    }
    function copyMessage() {
      const text = $('message').value.trim();
      if (!text) return toast('Nothing to copy');
      navigator.clipboard.writeText(text).then(() => toast('Message copied'));
    }

    // events
    $('tabContacts').onclick = showContacts;
    $('tabFollowups').onclick = showFollowups;
    $('addBtn').onclick = openAdd;
    $('closeBtn').onclick = closeModal;
    $('saveBtn').onclick = saveContact;
    $('deleteBtn').onclick = deleteContact;
    $('channel').onchange = updateChannelUI;
    $('search').oninput = renderContacts;
    $('pickContactBtn').onclick = pickFromPhoneBook;
    $('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
    $('composeClose').onclick = closeCompose;
    $('composeModal').onclick = e => { if (e.target === $('composeModal')) closeCompose(); };
    $('sendBtn').onclick = sendMessage;
    $('copyMsgBtn').onclick = copyMessage;
    document.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => { $('message').value = chip.getAttribute('data-t'); };
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeModal(); closeCompose(); }
    });

    if (!supportsContacts()) {
      $('pickHint').textContent = 'Phone book import is not available in this browser. Add manually.';
    }
